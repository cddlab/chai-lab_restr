# chai-lab RGI RMSD-restraint example via rgi_utils.
#
# An RMSD restraint drives the Kabsch-superposed RMSD of a moving atom group
# (atom_selection_target) toward `target_rmsd` vs a reference PDB (ref_pdb +
# atom_selection_ref), minimized by the CG solver each step.
#
# This file IS the rgi_utils `restraints_config` dict at top level (chai loads it
# verbatim) — do NOT nest it under a `restraints_config:` key.
#
# 1) Generate a reference PDB (e.g. a vanilla chai prediction of restr_example.fasta
#    converted to PDB via gemmi: s.make_pdb_string()) and save it as rmsd_ref.pdb.
# 2) Run:
#      python -m chai_lab.main fold restr_example.fasta out_rmsd_example \
#        --restraints-config-path rmsd_example.yaml --num-diffn-samples 2 \
#        --no-use-esm-embeddings
#
# Atoms pair by selection ORDER; the two selections MUST match in count (mismatch
# is a hard error). The selection DSL is chain/resid/index (no atom names), so a
# residue range selects ALL atoms of those residues.
verbose: true
gpu: true
max_iter: 200
method: "CG"

rmsd_restraints_config:
  # Drive residues 90-180 to match the reference's residues 90-180 (RMSD -> 0).
  - ref_pdb: rmsd_ref.pdb
    target_rmsd: 0.0
    atom_selection_ref: "chain A and (resid 90 to 180)"
    atom_selection_target: "chain A and (resid 90 to 180)"
    start_sigma: 99999999       # optional; omit -> active at every step
    # weight: 1.0               # optional (default 1.0)
