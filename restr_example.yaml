# chai-lab RGI example — restraint-guided inference via rgi_utils.
#
# Run:
#   python -m chai_lab.main fold restr_example.fasta <out_dir> \
#       --restraints-config-path restr_example.yaml --num-diffn-samples 2 \
#       --no-use-esm-embeddings
#
# This file IS the rgi_utils `restraints_config` dict at top level — chai loads it
# verbatim with yaml.safe_load. Do NOT nest it under a `restraints_config:` key
# (that is the boltz/protenix style; chai's sidecar is the dict itself).
#
# Selection DSL (selection.py): chain / resid N / resid A to B / index / and / or /
# not / ( ). `resid` is the per-chain 1-based residue ordinal (resets at each chain;
# ligand atoms each get their own ordinal) — it is NOT 0-based and NOT the author
# residue number.

verbose: true
max_iter: 1000
method: "CG"
gpu: true            # torch device: true=GPU, false=CPU
distance_restraints_config:
  # centroid distance between two protein residue groups, pulled to 25 Å. Qualify with
  # `chain A` so a bare resid range cannot also sweep in the ligand (chain B), whose
  # atoms carry their own per-chain ordinals.
  # Alternatives to `harmonic`: flat-bottomed {target_distance1, target_distance2},
  # flat-bottomed1 {target_distance1} (penalize below), flat-bottomed2 {target_distance2}.
  # Each entry MAY set its own `start_sigma:` (active when sigma <= start_sigma); it is
  # optional — omit it for active-at-every-step. There is no top-level/global default.
  - atom_selection1: "chain A and ((resid 5 to 84) or (resid 186 to 224))"
    atom_selection2: "chain A and (resid 90 to 180)"
    start_sigma: 99999999            # optional; omitted -> every step (active when sigma <= start_sigma)
    # stop_sigma: -1                 # optional lower bound (default -1 = off): release below this sigma
    # move: both                     # which group moves: both (default) / 1 (only atom_selection1)
    #                                #   / 2 (only atom_selection2). 1/2 pin the OTHER group (e.g.
    #                                #   move only a ligand toward a fixed protein pocket).
    harmonic:
      target_distance: 25.0

# angle_restraints_config — angle (DEGREES) of the centroids of THREE groups, vertex = group 2
#   (centroid1-centroid2-centroid3). Same restraint types + `move` as the distance restraint; CG-solved,
#   the centroid-only energy moves each free group rigidly. Uncomment (top-level dict, column 0):
# angle_restraints_config:
#   - atom_selection1: "chain A and (resid 5 to 84)"
#     atom_selection2: "chain A and (resid 90 to 180)"      # vertex (group 2)
#     atom_selection3: "chain A and (resid 186 to 224)"
#     harmonic: {target_angle: 90.0}     # DEGREES. alternatives: flat-bottomed
#       {target_angle1, target_angle2} | flat-bottomed1 {target_angle1} | flat-bottomed2 {target_angle2}
#     # move: 1,3      # DEFAULT: arms (1,3) free, vertex (group 2) pinned. override with
#     #                #   'all' (every group) | an index (e.g. 1) | a list [1, 3]
#     # weight: 1.0    # optional; start_sigma / stop_sigma optional (as distance)

# dihedral_restraints_config — dihedral (DEGREES) of FOUR group centroids, axis = group2-group3
#   (centroid1-centroid2-centroid3-centroid4). `harmonic` is periodicity-safe (wrapped to +-180); flat-bottomed
#   windows cannot straddle +-180. Uncomment:
# dihedral_restraints_config:
#   - atom_selection1: "chain A and (resid 5 to 50)"
#     atom_selection2: "chain A and (resid 51 to 100)"
#     atom_selection3: "chain A and (resid 101 to 150)"
#     atom_selection4: "chain A and (resid 151 to 224)"
#     harmonic: {target_dihedral: 180.0}   # DEGREES. or flat-bottomed
#       {target_dihedral1, target_dihedral2} | flat-bottomed1 | flat-bottomed2
#     # move: 1,4      # DEFAULT: ends (1,4) free, axis (groups 2,3) pinned. override with
#     #                #   'all' | an index | a list [1, 4]
#     # weight / start_sigma / stop_sigma: optional (as angle_restraints_config)

conformer_restraints_config:
  # Keep the GLN ligand at its ideal RDKit geometry. chai drops intra-ligand bond
  # orders at every layer, so the adapter rebuilds the mol from the source SMILES
  # (Kekulized -> correct valence + aromaticity + stereo); bond/angle/chiral all apply.
  start_sigma: 99999999             # optional; ONE value for ALL conformer terms (all
  #                                 #   ligands). Lower it (e.g. 1.0) to enforce ligand
  #                                 #   geometry only late in denoising.
  # stop_sigma: -1                  # optional lower bound for ALL conformer terms (default -1 = off)
  bond: {weight: 1.0}
  angle: {weight: 1.0}
  chiral: {weight: 1.0}     # GLN has one stereocentre (CA); the SMILES-derived ETKDG target
  #                         #   fixes its enantiomer (chai's own ref conformer can be wrong).
  # dihedral = cis/trans (E/Z) of an acyclic non-aromatic double bond. GLN has none
  # (terminal C=O) so dihedrals=0 here; chai DOES detect them for ligands that have one
  # (the SMILES carries Kekulized bond orders), like the other six tools.
  dihedral: {weight: 1.0}
  vdw: {weight: 1.0, mode: intramolecular}   # static, all-backend VdW

# rmsd_restraints_config — Kabsch-superposed RMSD of a moving group toward target_rmsd vs a
#   reference PDB. REQUIRES a reference: fold restr_example.fasta once WITHOUT this sidecar,
#   then convert to rmsd_ref.pdb (gemmi make_pdb_string) before running. Atoms pair by IDENTITY
#   (chain, resid, atom-name), so the ref atom order need not match. Every key is shown below;
#   uncomment the optional (commented) ones as needed. (top-level dict, column 0.)
rmsd_restraints_config:
  - ref_pdb: rmsd_ref.pdb        # REQUIRED: path to the reference PDB
    target_rmsd: 0.0             # REQUIRED: target Kabsch-RMSD in A (0 = match the ref)
    # weight: 1.0                # optional (default 1.0)
    # start_sigma: 99999999      # optional (omit -> active every step; e.g. 1.0 = late only)
    # stop_sigma: 1.0            # optional LOWER bound (default -1 = off): RELEASE the restraint
    #                            #   below this sigma (window stop<=sigma<=start) so the model
    #                            #   re-idealises geometry it held distorted — fixes a broken
    #                            #   peptide bond at a restrained-residue / free unmodeled-tail
    #                            #   boundary; 1.0 validated for this whole-structure target_rmsd=0.
    # --- residue correspondence (optional) ---
    # pairing: identity          # "identity" (default: pair by chain/resid/atom-name) OR
    #                            #   "align" = sequence-align polymer chains (BLOSUM62) so a
    #                            #   HOMOLOG ref (substitutions/indels/renumbering) maps on.
    #                            #   NOTE align pairs backbone + ANY shared side-chain atom
    #                            #   names by default, pinning a substituted side chain; add
    #                            #   a `name CA` atom_selection to superpose backbone only.
    # best_effort: true          # default true (skip atoms unmatched in the ref); set
    #                            #   false for STRICT pairing (raise on any unmatched atom)
    # --- atom selection (optional; omit -> WHOLE structure, best-effort) ---
    # atom_selection_ref: "chain A and (resid 90 to 180)"      # shorthand, ref side:
    # atom_selection_target: "chain A and (resid 90 to 180)"   #   sets BOTH fit AND calc
    # --- OR split superposition (fit) vs measured (calc) atoms ---
    # atom_selection_ref_fit: "chain A and (resid 5 to 220)"       # atoms superposed
    # atom_selection_target_fit: "chain A and (resid 5 to 220)"
    # atom_selection_ref_calc: "chain A and (resid 90 to 180)"     # atoms measured
    # atom_selection_target_calc: "chain A and (resid 90 to 180)"
