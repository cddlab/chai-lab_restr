# chai group-COM angle + dihedral E2E sidecar (reuse restr_example.fasta). Top-level
# dict (chai sidecar style). SEPARATE from restr_example.yaml.
verbose: true
gpu: true
max_iter: 1000
method: "CG"
angle_restraints_config:
  - atom_selection1: "chain A and (resid 5 to 84)"
    atom_selection2: "chain A and (resid 90 to 180)"     # vertex (pinned by default)
    atom_selection3: "chain A and (resid 186 to 224)"
    harmonic: {target_angle: 90.0}
    start_sigma: 99999999
dihedral_restraints_config:
  - atom_selection1: "chain A and (resid 5 to 50)"
    atom_selection2: "chain A and (resid 51 to 100)"     # axis (pinned by default)
    atom_selection3: "chain A and (resid 101 to 150)"    # axis (pinned by default)
    atom_selection4: "chain A and (resid 151 to 224)"
    harmonic: {target_dihedral: 180.0}
    start_sigma: 99999999
